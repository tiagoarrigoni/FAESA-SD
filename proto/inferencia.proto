syntax = "proto3";

package inferencia;

// Contrato do servico - Aula 4.
// Gere os stubs com:
//   python -m grpc_tools.protoc -I proto --python_out=. \
//          --grpc_python_out=. proto/inferencia.proto

service Inferencia {
  // Ja implementado no exemplo.
  rpc Prever (PedidoPrever) returns (RespostaPrever);

  // TAREFA 4: implemente este metodo no servidor gRPC.
  rpc PreverLote (PedidoLote) returns (RespostaLote);
}

message PedidoPrever {
  string texto = 1;
}

message RespostaPrever {
  string texto = 1;
  string sentimento = 2;
  double confianca = 3;
}

message PedidoLote {
  repeated string textos = 1;
}

message RespostaLote {
  repeated RespostaPrever resultados = 1;
}
